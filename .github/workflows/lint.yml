name: Lint
on: push

jobs:
  lint:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    steps:
    - uses: actions/checkout@v7
    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v6
      with:
        python-version: ${{ matrix.python-version }}
        cache: pip
        cache-dependency-path: pyproject.toml
        allow-prereleases: true
    - run: pip install -e '.[lint]'
    - run: ruff check amazon_to_sqlite tests
    - run: ruff format --check amazon_to_sqlite tests
    - run: mypy amazon_to_sqlite
    - run: pytest
    - run: pyroma . --min=10
    - name: CLI smoke test
      run: |
        amazon-to-sqlite --version
        python -m amazon_to_sqlite --help |& grep -qi 'usage:'
